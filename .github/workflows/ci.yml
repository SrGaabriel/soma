name: CI

on:
    push:
    pull_request:

env:
    GHC_VERSION: "9.12.2"
    CABAL_VERSION: "3.12"
    RUST_STABLE: "stable"
    RUST_NIGHTLY: "nightly"

jobs:
    haskell-build:
        name: Build Haskell (soma)
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
            fail-fast: false

        steps:
            - uses: actions/checkout@v4

            - name: Setup Haskell
              uses: haskell-actions/setup@v2
              with:
                  ghc-version: ${{ env.GHC_VERSION }}
                  cabal-version: ${{ env.CABAL_VERSION }}
                  enable-stack: false

            - name: Cache Cabal packages
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cabal/packages
                      ~/.cabal/store
                      dist-newstyle
                  key: ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-cabal-${{ hashFiles('soma.cabal', 'cabal.project') }}
                  restore-keys: |
                      ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-cabal-
                      ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-

            - name: Update Cabal package index
              run: cabal update

            - name: Configure project
              run: cabal configure --enable-tests --enable-benchmarks

            - name: Build dependencies
              run: cabal build --only-dependencies all

            - name: Build project
              run: cabal build all

            - name: Run tests
              run: cabal test all --test-show-details=direct
              continue-on-error: true

            - name: Generate documentation
              run: cabal haddock all
              continue-on-error: true

            - name: Prepare executable (Linux)
              if: matrix.os == 'ubuntu-latest'
              run: |
                  ARCH=$(uname -m)
                  TARGET="${ARCH}-unknown-linux-gnu"
                  mkdir -p artifacts
                  cp $(cabal list-bin exe:soma) artifacts/somac-${TARGET}
                  chmod +x artifacts/somac-${TARGET}

            - name: Prepare executable (macOS)
              if: matrix.os == 'macos-latest'
              run: |
                  ARCH=$(uname -m)
                  TARGET="${ARCH}-apple-darwin"
                  mkdir -p artifacts
                  cp $(cabal list-bin exe:soma) artifacts/somac-${TARGET}
                  chmod +x artifacts/somac-${TARGET}

            - name: Prepare executable (Windows)
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  $arch = if ($env:PROCESSOR_ARCHITECTURE -eq "AMD64") { "x86_64" } else { $env:PROCESSOR_ARCHITECTURE.ToLower() }
                  $target = "$arch-pc-windows-msvc"
                  New-Item -ItemType Directory -Force -Path artifacts
                  $exePath = cabal list-bin exe:soma
                  Copy-Item $exePath "artifacts/somac-$target.exe"

            - name: Upload executable artifact
              uses: actions/upload-artifact@v4
              with:
                  name: somac-${{ runner.os }}-${{ runner.arch }}
                  path: artifacts/somac-*
                  if-no-files-found: error

    rust-build:
        name: Build Rust (haoma)
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                rust: [stable, nightly]
            fail-fast: false

        defaults:
            run:
                working-directory: haoma

        steps:
            - uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ matrix.rust }}
                  components: rustfmt, clippy

            - name: Cache Cargo dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      haoma/target/
                  key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('haoma/Cargo.toml', 'haoma/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-${{ matrix.rust }}-
                      ${{ runner.os }}-cargo-

            - name: Build project
              run: cargo build --verbose --all-features

            - name: Run tests
              run: cargo test --verbose --all-features
              continue-on-error: true

            - name: Build release
              run: cargo build --release --verbose

            - name: Prepare executable (Linux)
              if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
              run: |
                  TARGET=$(rustc -vV | grep host | cut -d' ' -f2)
                  mkdir -p artifacts
                  cp target/release/haoma artifacts/haoma-${TARGET}
                  chmod +x artifacts/haoma-${TARGET}

            - name: Prepare executable (macOS)
              if: matrix.os == 'macos-latest' && matrix.rust == 'stable'
              run: |
                  TARGET=$(rustc -vV | grep host | cut -d' ' -f2)
                  mkdir -p artifacts
                  cp target/release/haoma artifacts/haoma-${TARGET}
                  chmod +x artifacts/haoma-${TARGET}

            - name: Prepare executable (Windows)
              if: matrix.os == 'windows-latest' && matrix.rust == 'stable'
              shell: pwsh
              run: |
                  $target = rustc -vV | Select-String "host:" | ForEach-Object { $_.Line.Split()[1] }
                  New-Item -ItemType Directory -Force -Path artifacts
                  Copy-Item target/release/haoma.exe "artifacts/haoma-$target.exe"

            - name: Upload executable artifact
              if: matrix.rust == 'stable'
              uses: actions/upload-artifact@v4
              with:
                  name: haoma-${{ runner.os }}-${{ runner.arch }}
                  path: haoma/artifacts/haoma-*
                  if-no-files-found: error

    lint:
        name: Lint and Format Check
        runs-on: ubuntu-latest
        continue-on-error: true

        steps:
            - uses: actions/checkout@v4

            - name: Setup Haskell
              uses: haskell-actions/setup@v2
              with:
                  ghc-version: ${{ env.GHC_VERSION }}
                  cabal-version: ${{ env.CABAL_VERSION }}

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Install HLint
              run: |
                  cabal update
                  cabal install hlint --install-method=copy --installdir=$HOME/.local/bin
                  echo "$HOME/.local/bin" >> $GITHUB_PATH

            - name: Run HLint
              run: hlint app --report
              continue-on-error: true

            - name: Check Rust formatting
              working-directory: haoma
              run: cargo fmt --all -- --check

            - name: Run Clippy
              working-directory: haoma
              run: cargo clippy --all-targets --all-features
              continue-on-error: true

    check-all:
        name: All Checks Passed
        needs: [haskell-build, rust-build, lint]
        runs-on: ubuntu-latest
        if: always()

        steps:
            - name: Check build results
              run: |
                  if [ "${{ needs.haskell-build.result }}" != "success" ]; then
                    echo "Haskell build failed"
                    exit 1
                  fi
                  if [ "${{ needs.rust-build.result }}" != "success" ]; then
                    echo "Rust build failed"
                    exit 1
                  fi
                  if [ "${{ needs.lint.result }}" == "failure" ]; then
                    echo "⚠️ Lint checks failed (non-blocking)"
                  fi
                  echo "All checks passed!"
